<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polly the Funny Parrot</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
    height: 100vh;
    color: #fff;
  }

  #canvas-container {
    width: 100%;
    height: 100vh;
    position: absolute;
    top: 0; left: 0;
    z-index: 1;
  }

  #ui-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 20px;
  }

  h1 {
    font-size: 2.2rem;
    text-shadow: 0 0 20px rgba(255, 200, 0, 0.6);
    color: #ffd700;
    margin-top: 10px;
    animation: titleBob 2s ease-in-out infinite;
  }

  @keyframes titleBob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .subtitle {
    font-size: 0.95rem;
    color: rgba(255,255,255,0.6);
    margin-top: 4px;
  }

  #speech-bubble {
    position: absolute;
    top: 15%;
    right: 10%;
    background: white;
    color: #333;
    padding: 16px 22px;
    border-radius: 20px;
    max-width: 320px;
    font-size: 1.1rem;
    font-weight: 600;
    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    opacity: 0;
    transform: scale(0.7);
    transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    pointer-events: auto;
    z-index: 20;
  }

  #speech-bubble.visible {
    opacity: 1;
    transform: scale(1);
  }

  #speech-bubble::after {
    content: '';
    position: absolute;
    bottom: -15px;
    left: 30px;
    border: 10px solid transparent;
    border-top-color: white;
  }

  #bottom-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
    pointer-events: auto;
  }

  #listen-btn {
    width: 80px; height: 80px;
    border-radius: 50%;
    border: 4px solid rgba(255,255,255,0.3);
    background: linear-gradient(135deg, #ff6b6b, #ee5a24);
    color: #fff;
    font-size: 2rem;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 25px rgba(238, 90, 36, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #listen-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 6px 35px rgba(238, 90, 36, 0.7);
  }

  #listen-btn.listening {
    background: linear-gradient(135deg, #2ecc71, #27ae60);
    box-shadow: 0 4px 25px rgba(46, 204, 113, 0.6);
    animation: pulse 1s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); border-color: rgba(255,255,255,0.3); }
    50% { transform: scale(1.08); border-color: rgba(255,255,255,0.7); }
  }

  #status {
    font-size: 0.9rem;
    color: rgba(255,255,255,0.7);
    text-align: center;
  }

  #text-input-row {
    display: flex;
    gap: 8px;
    pointer-events: auto;
  }

  #text-input {
    padding: 10px 16px;
    border-radius: 25px;
    border: 2px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.1);
    color: #fff;
    font-size: 1rem;
    width: 260px;
    outline: none;
    backdrop-filter: blur(10px);
  }

  #text-input::placeholder { color: rgba(255,255,255,0.4); }
  #text-input:focus { border-color: #ffd700; }

  #send-btn {
    padding: 10px 20px;
    border-radius: 25px;
    border: none;
    background: linear-gradient(135deg, #ffd700, #f39c12);
    color: #333;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.2s;
  }

  #send-btn:hover { transform: scale(1.05); }

  .particles {
    position: absolute;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    opacity: 0.3;
    animation: floatUp linear infinite;
  }

  @keyframes floatUp {
    0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
    10% { opacity: 0.3; }
    90% { opacity: 0.3; }
    100% { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
  }
</style>
</head>
<body>

<div class="particles" id="particles"></div>
<div id="canvas-container"></div>

<div id="ui-overlay">
  <div style="text-align:center;">
    <h1>Polly the Parrot</h1>
    <div class="subtitle">Talk to me and I'll repeat it... my way!</div>
  </div>

  <div id="speech-bubble"></div>

  <div id="bottom-panel">
    <div id="status">Click the mic or type something!</div>
    <button id="listen-btn" title="Click to talk">&#127908;</button>
    <div id="text-input-row">
      <input type="text" id="text-input" placeholder="Or type something here..." />
      <button id="send-btn">Squawk!</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============================================================
// 1. THREE.JS SCENE SETUP
// ============================================================
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 1, 8);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

// Lights
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xfff4e0, 1.0);
dirLight.position.set(5, 8, 5);
dirLight.castShadow = true;
scene.add(dirLight);

const rimLight = new THREE.PointLight(0x6699ff, 0.6, 20);
rimLight.position.set(-5, 3, -3);
scene.add(rimLight);

// ============================================================
// 2. BUILD THE PARROT (geometry-based, no models needed)
// ============================================================
const parrotGroup = new THREE.Group();

// --- Materials ---
const bodyMat = new THREE.MeshStandardMaterial({ color: 0x2ecc71, roughness: 0.5, metalness: 0.1 });
const bellyMat = new THREE.MeshStandardMaterial({ color: 0xf1c40f, roughness: 0.6 });
const beakMat = new THREE.MeshStandardMaterial({ color: 0xe67e22, roughness: 0.4 });
const eyeWhiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
const eyePupilMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
const wingMat = new THREE.MeshStandardMaterial({ color: 0x27ae60, roughness: 0.5 });
const tailMat = new THREE.MeshStandardMaterial({ color: 0xe74c3c, roughness: 0.5 });
const footMat = new THREE.MeshStandardMaterial({ color: 0xe67e22, roughness: 0.6 });
const crownMat = new THREE.MeshStandardMaterial({ color: 0xe74c3c, roughness: 0.4 });
const cheekMat = new THREE.MeshStandardMaterial({ color: 0xff6b9d, roughness: 0.7, transparent: true, opacity: 0.6 });

// --- Body ---
const bodyGeo = new THREE.SphereGeometry(1.2, 32, 32);
bodyGeo.scale(1, 1.15, 0.95);
const body = new THREE.Mesh(bodyGeo, bodyMat);
body.castShadow = true;
parrotGroup.add(body);

// --- Belly ---
const bellyGeo = new THREE.SphereGeometry(0.85, 32, 32);
bellyGeo.scale(1, 1.05, 0.6);
const belly = new THREE.Mesh(bellyGeo, bellyMat);
belly.position.set(0, -0.1, 0.55);
parrotGroup.add(belly);

// --- Head ---
const headGeo = new THREE.SphereGeometry(0.75, 32, 32);
const head = new THREE.Mesh(headGeo, bodyMat);
head.position.set(0, 1.5, 0.2);
head.castShadow = true;
parrotGroup.add(head);

// --- Crown feathers ---
for (let i = 0; i < 5; i++) {
  const featherGeo = new THREE.ConeGeometry(0.08, 0.5, 8);
  const feather = new THREE.Mesh(featherGeo, crownMat);
  const angle = (i - 2) * 0.25;
  feather.position.set(Math.sin(angle) * 0.2, 2.15 + Math.cos(i * 0.5) * 0.1, -0.1);
  feather.rotation.z = angle * 0.8;
  feather.rotation.x = -0.3;
  parrotGroup.add(feather);
}

// --- Eyes ---
function makeEye(x) {
  const eyeGroup = new THREE.Group();
  const whiteGeo = new THREE.SphereGeometry(0.2, 16, 16);
  const white = new THREE.Mesh(whiteGeo, eyeWhiteMat);

  const pupilGeo = new THREE.SphereGeometry(0.1, 16, 16);
  const pupil = new THREE.Mesh(pupilGeo, eyePupilMat);
  pupil.position.z = 0.13;
  pupil.position.x = x * 0.03;

  eyeGroup.add(white);
  eyeGroup.add(pupil);
  eyeGroup.position.set(x * 0.35, 1.65, 0.65);
  return eyeGroup;
}

const leftEye = makeEye(-1);
const rightEye = makeEye(1);
parrotGroup.add(leftEye);
parrotGroup.add(rightEye);

// --- Cheeks ---
for (const side of [-1, 1]) {
  const cheekGeo = new THREE.SphereGeometry(0.15, 16, 16);
  const cheek = new THREE.Mesh(cheekGeo, cheekMat);
  cheek.position.set(side * 0.5, 1.35, 0.6);
  cheek.scale.set(1.2, 0.8, 0.5);
  parrotGroup.add(cheek);
}

// --- Beak (upper + lower) ---
const beakGroup = new THREE.Group();

const upperBeakGeo = new THREE.ConeGeometry(0.2, 0.55, 16);
const upperBeak = new THREE.Mesh(upperBeakGeo, beakMat);
upperBeak.rotation.x = Math.PI / 2;
upperBeak.position.set(0, 0, 0.2);
beakGroup.add(upperBeak);

const lowerBeakGeo = new THREE.ConeGeometry(0.15, 0.4, 16);
const lowerBeak = new THREE.Mesh(lowerBeakGeo, beakMat);
lowerBeak.rotation.x = Math.PI / 2;
lowerBeak.position.set(0, -0.1, 0.15);
beakGroup.add(lowerBeak);

beakGroup.position.set(0, 1.4, 0.85);
parrotGroup.add(beakGroup);

// --- Wings ---
function makeWing(side) {
  const wingGroup = new THREE.Group();
  const wingGeo = new THREE.SphereGeometry(0.6, 16, 16);
  wingGeo.scale(0.4, 1.3, 0.7);
  const wing = new THREE.Mesh(wingGeo, wingMat);

  // Wing tip
  const tipGeo = new THREE.ConeGeometry(0.25, 0.6, 8);
  const tipMat = new THREE.MeshStandardMaterial({ color: 0x3498db, roughness: 0.5 });
  const tip = new THREE.Mesh(tipGeo, tipMat);
  tip.position.set(0, -0.7, 0);
  tip.rotation.z = side * 0.2;

  wingGroup.add(wing);
  wingGroup.add(tip);
  wingGroup.position.set(side * 1.1, 0.3, 0);
  wingGroup.rotation.z = side * 0.15;
  return wingGroup;
}

const leftWing = makeWing(-1);
const rightWing = makeWing(1);
parrotGroup.add(leftWing);
parrotGroup.add(rightWing);

// --- Tail ---
for (let i = 0; i < 4; i++) {
  const tailGeo = new THREE.CylinderGeometry(0.06, 0.12, 1.5, 8);
  const colors = [0xe74c3c, 0x3498db, 0x2ecc71, 0xf39c12];
  const tMat = new THREE.MeshStandardMaterial({ color: colors[i], roughness: 0.5 });
  const tail = new THREE.Mesh(tailGeo, tMat);
  tail.position.set((i - 1.5) * 0.15, -1.4, -0.7);
  tail.rotation.x = 0.4;
  tail.rotation.z = (i - 1.5) * 0.08;
  parrotGroup.add(tail);
}

// --- Feet ---
for (const side of [-1, 1]) {
  const footGroup = new THREE.Group();
  const legGeo = new THREE.CylinderGeometry(0.06, 0.06, 0.5, 8);
  const leg = new THREE.Mesh(legGeo, footMat);
  leg.position.y = -0.25;
  footGroup.add(leg);

  for (let t = 0; t < 3; t++) {
    const toeGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.3, 8);
    const toe = new THREE.Mesh(toeGeo, footMat);
    const angle = (t - 1) * 0.5;
    toe.position.set(Math.sin(angle) * 0.15, -0.55, Math.cos(angle) * 0.15);
    toe.rotation.x = 0.5;
    toe.rotation.z = angle * 0.3;
    footGroup.add(toe);
  }

  footGroup.position.set(side * 0.4, -1.4, 0.15);
  parrotGroup.add(footGroup);
}

// --- Perch ---
const perchGeo = new THREE.CylinderGeometry(0.12, 0.12, 4, 16);
const perchMat = new THREE.MeshStandardMaterial({ color: 0x8B4513, roughness: 0.8 });
const perch = new THREE.Mesh(perchGeo, perchMat);
perch.rotation.z = Math.PI / 2;
perch.position.set(0, -1.8, 0.15);
perch.castShadow = true;
parrotGroup.add(perch);

// Position the whole parrot
parrotGroup.position.y = -0.2;
scene.add(parrotGroup);

// ============================================================
// 3. ANIMATION VARIABLES
// ============================================================
let isTalking = false;
let isListening = false;
let talkTimer = 0;
const clock = new THREE.Clock();

// ============================================================
// 4. ANIMATION LOOP
// ============================================================
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const dt = clock.getDelta();

  // Idle bobbing
  parrotGroup.position.y = -0.2 + Math.sin(t * 1.5) * 0.12;
  parrotGroup.rotation.y = Math.sin(t * 0.7) * 0.15;

  // Head tilt
  head.rotation.z = Math.sin(t * 2) * 0.08;
  head.rotation.x = Math.sin(t * 1.3) * 0.05;

  // Eye look-around
  leftEye.children[1].position.x = -0.03 + Math.sin(t * 3) * 0.04;
  leftEye.children[1].position.y = Math.cos(t * 2.5) * 0.03;
  rightEye.children[1].position.x = 0.03 + Math.sin(t * 3) * 0.04;
  rightEye.children[1].position.y = Math.cos(t * 2.5) * 0.03;

  // Wing flap (subtle idle)
  const wingFlap = isTalking ? Math.sin(t * 12) * 0.4 : Math.sin(t * 2) * 0.08;
  leftWing.rotation.z = -0.15 + wingFlap;
  rightWing.rotation.z = 0.15 - wingFlap;

  // Beak open/close while talking
  if (isTalking) {
    const beakOpen = Math.abs(Math.sin(t * 15)) * 0.2;
    lowerBeak.position.y = -0.1 - beakOpen;
    lowerBeak.rotation.x = Math.PI / 2 + beakOpen * 1.5;

    // Body excitement
    body.scale.x = 1 + Math.sin(t * 8) * 0.03;
    body.scale.y = 1.15 + Math.cos(t * 8) * 0.03;

    // Bounce more
    parrotGroup.position.y = -0.2 + Math.sin(t * 4) * 0.2;
  } else {
    lowerBeak.position.y = -0.1;
    lowerBeak.rotation.x = Math.PI / 2;
    body.scale.x = 1;
    body.scale.y = 1.15;
  }

  // Crown feather wiggle
  parrotGroup.children.forEach((child, i) => {
    if (i >= 3 && i <= 7) { // crown feathers
      child.rotation.z = (i - 5) * 0.2 + Math.sin(t * 3 + i) * 0.15;
    }
  });

  // Listening animation: lean forward
  if (isListening) {
    head.rotation.x = THREE.MathUtils.lerp(head.rotation.x, 0.25, 0.05);
    parrotGroup.rotation.y = THREE.MathUtils.lerp(parrotGroup.rotation.y, -0.2, 0.03);
  }

  renderer.render(scene, camera);
}
animate();

// Window resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ============================================================
// 5. FLOATING PARTICLES
// ============================================================
(function createParticles() {
  const colors = ['#2ecc71', '#f1c40f', '#e74c3c', '#3498db', '#9b59b6', '#e67e22'];
  const particlesEl = document.getElementById('particles');
  for (let i = 0; i < 25; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random() * 8 + 3;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.left = Math.random() * 100 + '%';
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.animationDuration = (Math.random() * 15 + 10) + 's';
    p.style.animationDelay = (Math.random() * 20) + 's';
    particlesEl.appendChild(p);
  }
})();

// ============================================================
// 6. FUNNY TEXT TRANSFORMATIONS
// ============================================================
function funnyTransform(text) {
  const transforms = [
    t => "BAWK BAWK! " + t.toUpperCase() + "!!! SQUAAAWK!",
    t => "Polly says: \"" + t.split('').reverse().join('') + "\"... wait, that's backwards! BAWK!",
    t => t.split(' ').map(w => w + '-' + w.slice(-2)).join(' ') + "... *flaps wings wildly*",
    t => "Oooh oooh! " + t.replace(/\b(\w)/g, (m, c) => c.toUpperCase()) + "! Polly wants a cracker after that!",
    t => "*clears throat* AHEM... " + t.split(' ').map((w, i) => i % 2 === 0 ? w.toUpperCase() : w.toLowerCase()).join(' ') + " BAWK BAWK!",
    t => "Funny you say that! " + t.split(' ').sort(() => Math.random() - 0.5).join(' ') + "! ...Did I get that right? SQUAWK!",
    t => "Brrrawk! " + t.replace(/[aeiou]/gi, m => m.repeat(3)) + " *head bob*",
    t => "OH OH OH! " + t + "? That's what SHE said! ...I mean HE said! ...I mean SQUAAAWK!",
    t => "*leans in* Psssst... " + t.toLowerCase() + "... *whispers louder* " + t.toUpperCase() + "!!!",
    t => "BREAKING NEWS: Parrot reports \"" + t + "\"! More at eleven! BAWK!",
    t => "La la la~ " + t.split(' ').map(w => "~" + w + "~").join(' ') + " Polly is a STAR! SQUAWK!",
    t => "Roger roger! " + t + "! Copy that, over and BAWK! *salutes with wing*",
    t => t.split(' ').map(w => w[0] ? w[0].repeat(3) + w.slice(1) : w).join(' ') + "... I think I have a stutter! BAWK!",
    t => "In parrot language that's: " + t.replace(/[a-zA-Z]/g, () => ['squawk', 'bawk', 'chirp', 'tweet'][Math.floor(Math.random() * 4)]).slice(0, 80) + "!",
  ];
  return transforms[Math.floor(Math.random() * transforms.length)](text);
}

// ============================================================
// 7. SPEECH SYNTHESIS (talk back)
// ============================================================
function parrotSpeak(text) {
  const bubble = document.getElementById('speech-bubble');
  bubble.textContent = text;
  bubble.classList.add('visible');

  isTalking = true;

  const utterance = new SpeechSynthesisUtterance(text);

  // Funny voice settings
  const pitchOptions = [1.4, 1.6, 1.8, 2.0, 0.5];
  const rateOptions = [1.2, 1.5, 0.7, 1.8, 1.0];
  utterance.pitch = pitchOptions[Math.floor(Math.random() * pitchOptions.length)];
  utterance.rate = rateOptions[Math.floor(Math.random() * rateOptions.length)];
  utterance.volume = 1;

  // Try to pick a fun voice
  const voices = speechSynthesis.getVoices();
  if (voices.length > 0) {
    const preferred = voices.find(v => /female|fiona|samantha|victoria|karen/i.test(v.name));
    if (preferred) utterance.voice = preferred;
  }

  utterance.onend = () => {
    isTalking = false;
    setTimeout(() => bubble.classList.remove('visible'), 2500);
  };

  utterance.onerror = () => {
    isTalking = false;
    setTimeout(() => bubble.classList.remove('visible'), 2500);
  };

  speechSynthesis.cancel();
  speechSynthesis.speak(utterance);

  // Safety timeout
  setTimeout(() => { isTalking = false; }, 15000);
}

// Preload voices
speechSynthesis.getVoices();
speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();

// ============================================================
// 8. SPEECH RECOGNITION (listen)
// ============================================================
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;

if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.lang = 'en-US';

  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript;
    isListening = false;
    document.getElementById('listen-btn').classList.remove('listening');
    document.getElementById('status').textContent = 'You said: "' + transcript + '"';

    setTimeout(() => {
      const funny = funnyTransform(transcript);
      parrotSpeak(funny);
    }, 500);
  };

  recognition.onerror = (event) => {
    isListening = false;
    document.getElementById('listen-btn').classList.remove('listening');
    document.getElementById('status').textContent = "BAWK! Couldn't hear you! Try again!";
  };

  recognition.onend = () => {
    isListening = false;
    document.getElementById('listen-btn').classList.remove('listening');
  };
}

// ============================================================
// 9. UI EVENT HANDLERS
// ============================================================
document.getElementById('listen-btn').addEventListener('click', () => {
  if (!recognition) {
    document.getElementById('status').textContent = "Your browser doesn't support speech recognition! Type instead!";
    return;
  }

  if (isListening) {
    recognition.stop();
    isListening = false;
    document.getElementById('listen-btn').classList.remove('listening');
    document.getElementById('status').textContent = 'Click the mic or type something!';
    return;
  }

  isListening = true;
  document.getElementById('listen-btn').classList.add('listening');
  document.getElementById('status').textContent = 'Polly is listening... speak now!';
  recognition.start();
});

function handleTextInput() {
  const input = document.getElementById('text-input');
  const text = input.value.trim();
  if (!text) return;

  document.getElementById('status').textContent = 'You typed: "' + text + '"';
  input.value = '';

  setTimeout(() => {
    const funny = funnyTransform(text);
    parrotSpeak(funny);
  }, 500);
}

document.getElementById('send-btn').addEventListener('click', handleTextInput);
document.getElementById('text-input').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') handleTextInput();
});

// ============================================================
// 10. MOUSE INTERACTION - parrot looks at cursor
// ============================================================
window.addEventListener('mousemove', (e) => {
  const mx = (e.clientX / window.innerWidth - 0.5) * 2;
  const my = -(e.clientY / window.innerHeight - 0.5) * 2;

  // Parrot slightly turns toward mouse
  if (!isTalking && !isListening) {
    parrotGroup.rotation.y = mx * 0.3;
    head.rotation.x = -my * 0.15;
  }

  // Eyes follow cursor
  leftEye.children[1].position.x = -0.03 + mx * 0.05;
  leftEye.children[1].position.y = my * 0.04;
  rightEye.children[1].position.x = 0.03 + mx * 0.05;
  rightEye.children[1].position.y = my * 0.04;
});

</script>

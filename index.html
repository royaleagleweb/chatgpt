<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polly the Funny Parrot</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: linear-gradient(135deg, #1a4a1a, #2d5a27, #1a3a1a);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
    height: 100vh;
    color: #fff;
  }

  #canvas-container {
    width: 100%;
    height: 100vh;
    position: absolute;
    top: 0; left: 0;
    z-index: 1;
  }

  #ui-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 20px;
  }

  h1 {
    font-size: 2.2rem;
    text-shadow: 0 0 20px rgba(255, 200, 0, 0.6);
    color: #ffd700;
    margin-top: 10px;
    animation: titleBob 2s ease-in-out infinite;
  }

  @keyframes titleBob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .subtitle {
    font-size: 0.95rem;
    color: rgba(255,255,255,0.6);
    margin-top: 4px;
  }

  #speech-bubble {
    position: absolute;
    top: 15%;
    right: 10%;
    background: white;
    color: #333;
    padding: 16px 22px;
    border-radius: 20px;
    max-width: 320px;
    font-size: 1.1rem;
    font-weight: 600;
    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    opacity: 0;
    transform: scale(0.7);
    transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    pointer-events: auto;
    z-index: 20;
  }

  #speech-bubble.visible {
    opacity: 1;
    transform: scale(1);
  }

  #speech-bubble::after {
    content: '';
    position: absolute;
    bottom: -15px;
    left: 30px;
    border: 10px solid transparent;
    border-top-color: white;
  }

  #bottom-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
    pointer-events: auto;
  }

  #listen-btn {
    width: 80px; height: 80px;
    border-radius: 50%;
    border: 4px solid rgba(255,255,255,0.3);
    background: linear-gradient(135deg, #ff6b6b, #ee5a24);
    color: #fff;
    font-size: 2rem;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 25px rgba(238, 90, 36, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #listen-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 6px 35px rgba(238, 90, 36, 0.7);
  }

  #listen-btn.listening {
    background: linear-gradient(135deg, #2ecc71, #27ae60);
    box-shadow: 0 4px 25px rgba(46, 204, 113, 0.6);
    animation: pulse 1s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); border-color: rgba(255,255,255,0.3); }
    50% { transform: scale(1.08); border-color: rgba(255,255,255,0.7); }
  }

  #status {
    font-size: 0.9rem;
    color: rgba(255,255,255,0.7);
    text-align: center;
  }

  #text-input-row {
    display: flex;
    gap: 8px;
    pointer-events: auto;
  }

  #text-input {
    padding: 10px 16px;
    border-radius: 25px;
    border: 2px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.1);
    color: #fff;
    font-size: 1rem;
    width: 260px;
    outline: none;
    backdrop-filter: blur(10px);
  }

  #text-input::placeholder { color: rgba(255,255,255,0.4); }
  #text-input:focus { border-color: #ffd700; }

  #send-btn {
    padding: 10px 20px;
    border-radius: 25px;
    border: none;
    background: linear-gradient(135deg, #ffd700, #f39c12);
    color: #333;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.2s;
  }

  #send-btn:hover { transform: scale(1.05); }

  .particles {
    position: absolute;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    opacity: 0.3;
    animation: floatUp linear infinite;
  }

  @keyframes floatUp {
    0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
    10% { opacity: 0.3; }
    90% { opacity: 0.3; }
    100% { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
  }
</style>
</head>
<body>

<div class="particles" id="particles"></div>
<div id="canvas-container"></div>

<div id="ui-overlay">
  <div style="text-align:center;">
    <h1>Polly the Parrot</h1>
    <div class="subtitle">Talk to me and I'll repeat it... my way!</div>
  </div>

  <div id="speech-bubble"></div>

  <div id="bottom-panel">
    <div id="status">Click the mic or type something!</div>
    <button id="listen-btn" title="Click to talk">&#127908;</button>
    <div id="text-input-row">
      <input type="text" id="text-input" placeholder="Or type something here..." />
      <button id="send-btn">Squawk!</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============================================================
// 1. THREE.JS SCENE SETUP
// ============================================================
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 1, 8);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

// Lights
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xfff4e0, 1.0);
dirLight.position.set(5, 8, 5);
dirLight.castShadow = true;
scene.add(dirLight);

const rimLight = new THREE.PointLight(0x6699ff, 0.6, 20);
rimLight.position.set(-5, 3, -3);
scene.add(rimLight);

// ============================================================
// 2. BUILD THE PARROT — Realistic Sun Conure
// ============================================================
const parrotGroup = new THREE.Group();

// --- Materials (Sun Conure palette) ---
const yellowMat = new THREE.MeshStandardMaterial({ color: 0xf5c832, roughness: 0.75, metalness: 0.0 });
const deepYellowMat = new THREE.MeshStandardMaterial({ color: 0xe8a817, roughness: 0.75 });
const orangeMat = new THREE.MeshStandardMaterial({ color: 0xe8751a, roughness: 0.7 });
const orangeFaceMat = new THREE.MeshStandardMaterial({ color: 0xdf6a20, roughness: 0.7 });
const greenWingMat = new THREE.MeshStandardMaterial({ color: 0x4a8c3f, roughness: 0.65 });
const darkGreenMat = new THREE.MeshStandardMaterial({ color: 0x2d6b2e, roughness: 0.65 });
const blueWingMat = new THREE.MeshStandardMaterial({ color: 0x1a5276, roughness: 0.6 });
const navyMat = new THREE.MeshStandardMaterial({ color: 0x1b3a50, roughness: 0.6 });
const beakMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.3, metalness: 0.1 });
const beakLightMat = new THREE.MeshStandardMaterial({ color: 0x3d3d3d, roughness: 0.4 });
const eyeRingMat = new THREE.MeshStandardMaterial({ color: 0xe8e0d0, roughness: 0.5 });
const eyeWhiteMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
const eyePupilMat = new THREE.MeshStandardMaterial({ color: 0x050505 });
const eyeHighlightMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.5 });
const footMat = new THREE.MeshStandardMaterial({ color: 0x888080, roughness: 0.7 });
const clawMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.5 });

// Helper: add fluffy feather bumps
function addFluffClusters(parent, count, radius, yMin, yMax, mat, size) {
  for (let i = 0; i < count; i++) {
    const theta = Math.random() * Math.PI * 2;
    const y = yMin + Math.random() * (yMax - yMin);
    const r = radius * (0.9 + Math.random() * 0.2);
    const geo = new THREE.SphereGeometry(size * (0.6 + Math.random() * 0.6), 8, 8);
    const fluff = new THREE.Mesh(geo, mat);
    fluff.position.set(Math.cos(theta) * r, y, Math.sin(theta) * r);
    fluff.scale.set(1 + Math.random() * 0.3, 0.7 + Math.random() * 0.5, 1 + Math.random() * 0.3);
    parent.add(fluff);
  }
}

// --- BODY (plump, egg-shaped) ---
const bodyGeo = new THREE.SphereGeometry(1.15, 32, 32);
bodyGeo.scale(0.95, 1.2, 0.9);
const body = new THREE.Mesh(bodyGeo, yellowMat);
body.castShadow = true;
parrotGroup.add(body);

// Chest - orange gradient
const chestGeo = new THREE.SphereGeometry(0.95, 32, 32);
chestGeo.scale(0.9, 0.9, 0.65);
const chest = new THREE.Mesh(chestGeo, orangeMat);
chest.position.set(0, -0.25, 0.5);
parrotGroup.add(chest);

// Fluffy breast feathers
addFluffClusters(parrotGroup, 30, 0.85, -0.7, 0.5, yellowMat, 0.12);
addFluffClusters(parrotGroup, 15, 0.75, -0.6, 0.0, orangeMat, 0.1);
addFluffClusters(parrotGroup, 12, 0.9, 0.3, 0.8, deepYellowMat, 0.1);

// Back feathers (green tint)
for (let i = 0; i < 10; i++) {
  const theta = Math.PI + (Math.random() - 0.5) * 1.5;
  const y = -0.3 + Math.random() * 1.0;
  const geo = new THREE.SphereGeometry(0.12, 8, 8);
  const fluff = new THREE.Mesh(geo, greenWingMat);
  fluff.position.set(Math.cos(theta) * 0.95, y, Math.sin(theta) * 0.8);
  parrotGroup.add(fluff);
}

// --- HEAD ---
const headGeo = new THREE.SphereGeometry(0.72, 32, 32);
headGeo.scale(0.95, 1.0, 0.92);
const head = new THREE.Mesh(headGeo, yellowMat);
head.position.set(0, 1.45, 0.15);
head.castShadow = true;
parrotGroup.add(head);

// Face - orange patch
const faceGeo = new THREE.SphereGeometry(0.55, 32, 32);
faceGeo.scale(0.85, 0.7, 0.5);
const face = new THREE.Mesh(faceGeo, orangeFaceMat);
face.position.set(0, 1.35, 0.6);
parrotGroup.add(face);

// Head fluff (top yellow feathers sticking up)
for (let i = 0; i < 12; i++) {
  const theta = (Math.random() - 0.5) * Math.PI;
  const geo = new THREE.SphereGeometry(0.07 + Math.random() * 0.05, 8, 8);
  geo.scale(1, 1.5, 1);
  const fluff = new THREE.Mesh(geo, yellowMat);
  fluff.position.set(
    Math.sin(theta) * 0.35,
    2.05 + Math.random() * 0.2,
    -0.05 + Math.cos(theta) * 0.15
  );
  parrotGroup.add(fluff);
}

// Green patches on top/back of head
for (let i = 0; i < 6; i++) {
  const geo = new THREE.SphereGeometry(0.08, 8, 8);
  const fluff = new THREE.Mesh(geo, greenWingMat);
  fluff.position.set(
    (Math.random() - 0.5) * 0.4,
    1.9 + Math.random() * 0.2,
    -0.2 - Math.random() * 0.15
  );
  parrotGroup.add(fluff);
}

// --- EYES (realistic with eye ring) ---
function makeEye(side) {
  const eyeGroup = new THREE.Group();

  // Bare eye ring (whitish skin patch, like real Sun Conures)
  const ringGeo = new THREE.TorusGeometry(0.16, 0.04, 12, 24);
  const ring = new THREE.Mesh(ringGeo, eyeRingMat);
  eyeGroup.add(ring);

  // Dark eye
  const eyeGeo = new THREE.SphereGeometry(0.13, 20, 20);
  const eye = new THREE.Mesh(eyeGeo, eyeWhiteMat);
  eye.position.z = 0.02;
  eyeGroup.add(eye);

  // Pupil
  const pupilGeo = new THREE.SphereGeometry(0.07, 16, 16);
  const pupil = new THREE.Mesh(pupilGeo, eyePupilMat);
  pupil.position.z = 0.1;
  pupil.position.x = side * 0.02;
  eyeGroup.add(pupil);

  // Eye highlight
  const hlGeo = new THREE.SphereGeometry(0.03, 8, 8);
  const hl = new THREE.Mesh(hlGeo, eyeHighlightMat);
  hl.position.set(side * 0.03, 0.04, 0.14);
  eyeGroup.add(hl);

  eyeGroup.position.set(side * 0.38, 1.55, 0.6);
  eyeGroup.rotation.y = side * 0.3;
  return eyeGroup;
}

const leftEye = makeEye(-1);
const rightEye = makeEye(1);
parrotGroup.add(leftEye);
parrotGroup.add(rightEye);

// --- BEAK (curved, dark gray like real Sun Conure) ---
const beakGroup = new THREE.Group();

// Upper beak (curved hook shape)
const upperBeakGeo = new THREE.SphereGeometry(0.2, 16, 16);
upperBeakGeo.scale(0.8, 0.6, 1.4);
const upperBeak = new THREE.Mesh(upperBeakGeo, beakMat);
upperBeak.position.set(0, 0.05, 0.12);
beakGroup.add(upperBeak);

// Hook tip
const hookGeo = new THREE.SphereGeometry(0.1, 12, 12);
hookGeo.scale(0.7, 0.5, 1.0);
const hook = new THREE.Mesh(hookGeo, beakMat);
hook.position.set(0, -0.06, 0.3);
beakGroup.add(hook);

// Lower beak (mandible)
const lowerBeakGeo = new THREE.SphereGeometry(0.14, 16, 16);
lowerBeakGeo.scale(0.7, 0.35, 1.0);
const lowerBeak = new THREE.Mesh(lowerBeakGeo, beakLightMat);
lowerBeak.position.set(0, -0.1, 0.1);
beakGroup.add(lowerBeak);

// Cere (nostril area)
const cereGeo = new THREE.SphereGeometry(0.12, 12, 12);
cereGeo.scale(0.9, 0.5, 0.6);
const cere = new THREE.Mesh(cereGeo, beakLightMat);
cere.position.set(0, 0.12, 0.08);
beakGroup.add(cere);

beakGroup.position.set(0, 1.3, 0.75);
parrotGroup.add(beakGroup);

// --- WINGS (layered green/blue feathers) ---
function makeWing(side) {
  const wingGroup = new THREE.Group();

  // Main wing body - green
  const mainGeo = new THREE.SphereGeometry(0.7, 16, 16);
  mainGeo.scale(0.35, 1.4, 0.75);
  const main = new THREE.Mesh(mainGeo, greenWingMat);
  wingGroup.add(main);

  // Secondary coverts - darker green
  const secGeo = new THREE.SphereGeometry(0.5, 12, 12);
  secGeo.scale(0.3, 1.0, 0.6);
  const sec = new THREE.Mesh(secGeo, darkGreenMat);
  sec.position.set(side * 0.05, -0.4, -0.1);
  wingGroup.add(sec);

  // Blue flight feathers
  const blueGeo = new THREE.SphereGeometry(0.4, 12, 12);
  blueGeo.scale(0.25, 1.1, 0.55);
  const blue = new THREE.Mesh(blueGeo, blueWingMat);
  blue.position.set(side * 0.05, -0.65, -0.15);
  wingGroup.add(blue);

  // Navy tips
  const tipGeo = new THREE.ConeGeometry(0.18, 0.5, 10);
  const tip = new THREE.Mesh(tipGeo, navyMat);
  tip.position.set(0, -1.0, -0.1);
  tip.rotation.z = side * 0.15;
  wingGroup.add(tip);

  // Yellow shoulder patch
  const shoulderGeo = new THREE.SphereGeometry(0.2, 10, 10);
  shoulderGeo.scale(1.2, 0.7, 0.8);
  const shoulder = new THREE.Mesh(shoulderGeo, deepYellowMat);
  shoulder.position.set(0, 0.55, 0.1);
  wingGroup.add(shoulder);

  // Feather texture bumps
  for (let i = 0; i < 8; i++) {
    const fGeo = new THREE.SphereGeometry(0.06 + Math.random() * 0.04, 6, 6);
    const fMat = i < 4 ? greenWingMat : blueWingMat;
    const f = new THREE.Mesh(fGeo, fMat);
    f.position.set(
      side * (0.12 + Math.random() * 0.08),
      0.3 - i * 0.2 + Math.random() * 0.1,
      0.15 + Math.random() * 0.1
    );
    wingGroup.add(f);
  }

  wingGroup.position.set(side * 1.0, 0.2, -0.05);
  wingGroup.rotation.z = side * 0.2;
  return wingGroup;
}

const leftWing = makeWing(-1);
const rightWing = makeWing(1);
parrotGroup.add(leftWing);
parrotGroup.add(rightWing);

// --- TAIL (long, green/blue feathers) ---
const tailGroup = new THREE.Group();
const tailColors = [greenWingMat, blueWingMat, darkGreenMat, greenWingMat, blueWingMat];
for (let i = 0; i < 5; i++) {
  const tGeo = new THREE.CylinderGeometry(0.04, 0.08, 1.8, 8);
  const tail = new THREE.Mesh(tGeo, tailColors[i]);
  tail.position.set((i - 2) * 0.1, -0.9, 0);
  tail.rotation.z = (i - 2) * 0.04;
  tailGroup.add(tail);

  // Feather tip
  const tipGeo = new THREE.SphereGeometry(0.06, 8, 8);
  tipGeo.scale(1.2, 2, 0.8);
  const tip = new THREE.Mesh(tipGeo, tailColors[i]);
  tip.position.set((i - 2) * 0.1, -1.8, 0);
  tailGroup.add(tip);
}
tailGroup.position.set(0, -0.9, -0.65);
tailGroup.rotation.x = 0.35;
parrotGroup.add(tailGroup);

// --- FEET (realistic gray with claws gripping perch) ---
for (const side of [-1, 1]) {
  const footGroup = new THREE.Group();

  // Leg
  const legGeo = new THREE.CylinderGeometry(0.05, 0.06, 0.55, 10);
  const leg = new THREE.Mesh(legGeo, footMat);
  leg.position.y = -0.28;
  footGroup.add(leg);

  // Scaly texture on leg
  for (let s = 0; s < 4; s++) {
    const scaleGeo = new THREE.TorusGeometry(0.065, 0.012, 6, 12);
    const scale = new THREE.Mesh(scaleGeo, footMat);
    scale.position.y = -0.1 - s * 0.1;
    scale.rotation.x = Math.PI / 2;
    footGroup.add(scale);
  }

  // Front toes (2 forward for zygodactyl grip)
  for (let t = 0; t < 2; t++) {
    const toeGeo = new THREE.CylinderGeometry(0.025, 0.02, 0.32, 8);
    const toe = new THREE.Mesh(toeGeo, footMat);
    const angle = (t - 0.5) * 0.6;
    toe.position.set(Math.sin(angle) * 0.12, -0.58, Math.abs(Math.cos(angle)) * 0.15);
    toe.rotation.x = 0.7;
    toe.rotation.z = angle * 0.3;
    footGroup.add(toe);

    // Claw
    const clawGeo = new THREE.ConeGeometry(0.018, 0.1, 6);
    const claw = new THREE.Mesh(clawGeo, clawMat);
    claw.position.set(Math.sin(angle) * 0.18, -0.68, Math.abs(Math.cos(angle)) * 0.25);
    claw.rotation.x = 0.9;
    footGroup.add(claw);
  }

  // Back toe (1 backward for grip)
  const backToeGeo = new THREE.CylinderGeometry(0.025, 0.02, 0.28, 8);
  const backToe = new THREE.Mesh(backToeGeo, footMat);
  backToe.position.set(0, -0.55, -0.12);
  backToe.rotation.x = -0.6;
  footGroup.add(backToe);

  const backClawGeo = new THREE.ConeGeometry(0.018, 0.08, 6);
  const backClaw = new THREE.Mesh(backClawGeo, clawMat);
  backClaw.position.set(0, -0.6, -0.22);
  backClaw.rotation.x = -0.9;
  footGroup.add(backClaw);

  footGroup.position.set(side * 0.35, -1.35, 0.15);
  parrotGroup.add(footGroup);
}

// --- PERCH (natural wood branch) ---
const perchGroup = new THREE.Group();
const perchMat = new THREE.MeshStandardMaterial({ color: 0x8B6914, roughness: 0.9, metalness: 0 });
const perchDarkMat = new THREE.MeshStandardMaterial({ color: 0x6B4F10, roughness: 0.95 });

// Main branch
const perchGeo = new THREE.CylinderGeometry(0.14, 0.12, 5, 12);
const perch = new THREE.Mesh(perchGeo, perchMat);
perch.rotation.z = Math.PI / 2;
perchGroup.add(perch);

// Bark texture bumps
for (let i = 0; i < 20; i++) {
  const bumpGeo = new THREE.SphereGeometry(0.03 + Math.random() * 0.03, 6, 6);
  bumpGeo.scale(1, 0.5, 1);
  const bump = new THREE.Mesh(bumpGeo, perchDarkMat);
  const angle = Math.random() * Math.PI * 2;
  bump.position.set(
    (Math.random() - 0.5) * 4,
    Math.sin(angle) * 0.13,
    Math.cos(angle) * 0.13
  );
  perchGroup.add(bump);
}

// Small branch stub
const stubGeo = new THREE.CylinderGeometry(0.04, 0.06, 0.3, 8);
const stub = new THREE.Mesh(stubGeo, perchDarkMat);
stub.position.set(1.2, 0.15, 0);
stub.rotation.z = -0.4;
perchGroup.add(stub);

perchGroup.position.set(0, -1.75, 0.15);
parrotGroup.add(perchGroup);

// --- Raised foot (like the photo!) ---
const raisedFoot = new THREE.Group();
const rfLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.05, 0.3, 8), footMat);
rfLeg.rotation.x = 0.5;
rfLeg.rotation.z = 0.3;
raisedFoot.add(rfLeg);
for (let t = 0; t < 3; t++) {
  const toeGeo = new THREE.CylinderGeometry(0.02, 0.015, 0.18, 6);
  const toe = new THREE.Mesh(toeGeo, footMat);
  toe.position.set(0.05 + t * 0.04, -0.1, 0.12 + t * 0.02);
  toe.rotation.x = 0.4 + t * 0.15;
  toe.rotation.z = (t - 1) * 0.25;
  raisedFoot.add(toe);
}
raisedFoot.position.set(0.55, -1.1, 0.4);
parrotGroup.add(raisedFoot);

// Position the whole parrot
parrotGroup.position.y = -0.2;
scene.add(parrotGroup);

// ============================================================
// 3. ANIMATION VARIABLES
// ============================================================
let isTalking = false;
let isListening = false;
let talkTimer = 0;
const clock = new THREE.Clock();

// ============================================================
// 4. ANIMATION LOOP
// ============================================================
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // Idle bobbing
  parrotGroup.position.y = -0.2 + Math.sin(t * 1.5) * 0.08;
  parrotGroup.rotation.y = Math.sin(t * 0.7) * 0.1;

  // Head tilt (like the photo — curious head cock)
  head.rotation.z = Math.sin(t * 1.8) * 0.12;
  head.rotation.x = Math.sin(t * 1.3) * 0.06;

  // Eye pupil look-around
  leftEye.children[2].position.x = -0.02 + Math.sin(t * 2.5) * 0.03;
  leftEye.children[2].position.y = Math.cos(t * 2) * 0.025;
  rightEye.children[2].position.x = 0.02 + Math.sin(t * 2.5) * 0.03;
  rightEye.children[2].position.y = Math.cos(t * 2) * 0.025;

  // Wing flap
  const wingFlap = isTalking ? Math.sin(t * 14) * 0.5 : Math.sin(t * 1.5) * 0.05;
  leftWing.rotation.z = -0.2 + wingFlap;
  rightWing.rotation.z = 0.2 - wingFlap;

  // Raised foot wiggle
  raisedFoot.rotation.z = 0.3 + Math.sin(t * 2) * 0.1;
  raisedFoot.position.y = -1.1 + Math.sin(t * 1.5) * 0.05;

  // Tail sway
  tailGroup.rotation.z = Math.sin(t * 1.2) * 0.08;

  // Beak open/close while talking
  if (isTalking) {
    const beakOpen = Math.abs(Math.sin(t * 18)) * 0.12;
    lowerBeak.position.y = -0.1 - beakOpen;
    lowerBeak.scale.y = 1 + beakOpen * 2;

    // Body puff up when talking
    body.scale.x = 0.95 + Math.sin(t * 10) * 0.04;
    body.scale.z = 0.9 + Math.cos(t * 10) * 0.04;

    // Excited bouncing
    parrotGroup.position.y = -0.2 + Math.sin(t * 5) * 0.15;
    head.rotation.z = Math.sin(t * 6) * 0.2;

    // Tail fans out when excited
    tailGroup.rotation.z = Math.sin(t * 4) * 0.15;
  } else {
    lowerBeak.position.y = -0.1;
    lowerBeak.scale.y = 1;
    body.scale.x = 0.95;
    body.scale.z = 0.9;
  }

  // Feather ruffle (body fluff shifts subtly)
  body.rotation.y = Math.sin(t * 0.8) * 0.03;

  // Listening animation: lean forward curiously
  if (isListening) {
    head.rotation.x = THREE.MathUtils.lerp(head.rotation.x, 0.3, 0.05);
    head.rotation.z = THREE.MathUtils.lerp(head.rotation.z, 0.25, 0.04);
    parrotGroup.rotation.y = THREE.MathUtils.lerp(parrotGroup.rotation.y, -0.15, 0.03);
  }

  renderer.render(scene, camera);
}
animate();

// Window resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ============================================================
// 5. FLOATING PARTICLES
// ============================================================

  const colors = ['#4a8c3f', '#f5c832', '#e8751a', '#1a5276', '#2d6b2e', '#e8a817'];
  const particlesEl = document.getElementById('particles');
  for (let i = 0; i < 25; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random() * 8 + 3;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.left = Math.random() * 100 + '%';
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.animationDuration = (Math.random() * 15 + 10) + 's';
    p.style.animationDelay = (Math.random() * 20) + 's';
    particlesEl.appendChild(p);
  }
})();

// ============================================================
// 6. FUNNY TEXT TRANSFORMATIONS
// ============================================================
function funnyTransform(text) {
  const transforms = [
    t => "BAWK BAWK! " + t.toUpperCase() + "!!! SQUAAAWK!",
    t => "Polly says: \"" + t.split('').reverse().join('') + "\"... wait, that's backwards! BAWK!",
    t => t.split(' ').map(w => w + '-' + w.slice(-2)).join(' ') + "... *flaps wings wildly*",
    t => "Oooh oooh! " + t.replace(/\b(\w)/g, (m, c) => c.toUpperCase()) + "! Polly wants a cracker after that!",
    t => "*clears throat* AHEM... " + t.split(' ').map((w, i) => i % 2 === 0 ? w.toUpperCase() : w.toLowerCase()).join(' ') + " BAWK BAWK!",
    t => "Funny you say that! " + t.split(' ').sort(() => Math.random() - 0.5).join(' ') + "! ...Did I get that right? SQUAWK!",
    t => "Brrrawk! " + t.replace(/[aeiou]/gi, m => m.repeat(3)) + " *head bob*",
    t => "OH OH OH! " + t + "? That's what the MONKEY said! ...Wait, monkeys don't talk! SQUAAAWK!",
    t => "*leans in* Psssst... " + t.toLowerCase() + "... *whispers louder* " + t.toUpperCase() + "!!!",
    t => "BREAKING NEWS: Parrot reports \"" + t + "\"! More at eleven! BAWK!",
    t => "La la la~ " + t.split(' ').map(w => "~" + w + "~").join(' ') + " Polly is a STAR! SQUAWK!",
    t => "Roger roger! " + t + "! Copy that, over and BAWK! *salutes with wing*",
    t => t.split(' ').map(w => w[0] ? w[0].repeat(3) + w.slice(1) : w).join(' ') + "... I think I have a stutter! BAWK!",
    t => "In parrot language that's: " + t.replace(/[a-zA-Z]/g, () => ['squawk', 'bawk', 'chirp', 'tweet'][Math.floor(Math.random() * 4)]).slice(0, 80) + "!",
  ];
  return transforms[Math.floor(Math.random() * transforms.length)](text);
}

// ============================================================
// 7. SPEECH SYNTHESIS (talk back)
// ============================================================
function parrotSpeak(text) {
  const bubble = document.getElementById('speech-bubble');
  bubble.textContent = text;
  bubble.classList.add('visible');

  isTalking = true;

  // Create screechy parrot AudioContext effect
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  // Play a parrot screech sound before speaking
  function playScreech() {
    const duration = 0.3 + Math.random() * 0.2;
    const osc1 = audioCtx.createOscillator();
    const osc2 = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();

    // Screechy harmonics
    osc1.type = 'sawtooth';
    osc1.frequency.setValueAtTime(800 + Math.random() * 600, audioCtx.currentTime);
    osc1.frequency.exponentialRampToValueAtTime(1800 + Math.random() * 800, audioCtx.currentTime + duration * 0.3);
    osc1.frequency.exponentialRampToValueAtTime(600 + Math.random() * 400, audioCtx.currentTime + duration);

    osc2.type = 'square';
    osc2.frequency.setValueAtTime(1200 + Math.random() * 500, audioCtx.currentTime);
    osc2.frequency.exponentialRampToValueAtTime(2000 + Math.random() * 600, audioCtx.currentTime + duration * 0.4);
    osc2.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + duration);

    filter.type = 'bandpass';
    filter.frequency.value = 1500;
    filter.Q.value = 3;

    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + duration * 0.2);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);

    osc1.connect(filter);
    osc2.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);

    osc1.start();
    osc2.start();
    osc1.stop(audioCtx.currentTime + duration);
    osc2.stop(audioCtx.currentTime + duration);
  }

  // Play 1-3 screeches
  const screechCount = 1 + Math.floor(Math.random() * 2);
  for (let i = 0; i < screechCount; i++) {
    setTimeout(() => playScreech(), i * 250);
  }

  // Then speak with screechy parrot voice
  setTimeout(() => {
    const utterance = new SpeechSynthesisUtterance(text);

    // HIGH pitch, like a screeching parrot
    utterance.pitch = 1.8 + Math.random() * 0.2; // Very high
    utterance.rate = 1.1 + Math.random() * 0.5;  // Fast and frantic
    utterance.volume = 1;

    const voices = speechSynthesis.getVoices();
    if (voices.length > 0) {
      // Try to find the highest-pitched voice available
      const preferred = voices.find(v => /female|fiona|samantha|victoria|karen|zira/i.test(v.name));
      if (preferred) utterance.voice = preferred;
    }

    utterance.onend = () => {
      // End screech
      setTimeout(() => playScreech(), 100);
      setTimeout(() => {
        isTalking = false;
        setTimeout(() => bubble.classList.remove('visible'), 2000);
      }, 400);
    };

    utterance.onerror = () => {
      isTalking = false;
      setTimeout(() => bubble.classList.remove('visible'), 2500);
    };

    speechSynthesis.cancel();
    speechSynthesis.speak(utterance);
  }, screechCount * 280);

  // Safety timeout
  setTimeout(() => { isTalking = false; }, 20000);
}

// Preload voices
speechSynthesis.getVoices();
speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();

// ============================================================
// 8. SPEECH RECOGNITION (listen)
// ============================================================
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;

if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.lang = 'en-US';

  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript;
    isListening = false;
    document.getElementById('listen-btn').classList.remove('listening');
    document.getElementById('status').textContent = 'You said: "' + transcript + '"';

    setTimeout(() => {
      const funny = funnyTransform(transcript);
      parrotSpeak(funny);
    }, 500);
  };

  recognition.onerror = (event) => {
    isListening = false;
    document.getElementById('listen-btn').classList.remove('listening');
    document.getElementById('status').textContent = "BAWK! Couldn't hear you! Try again!";
  };

  recognition.onend = () => {
    isListening = false;
    document.getElementById('listen-btn').classList.remove('listening');
  };
}

// ============================================================
// 9. UI EVENT HANDLERS
// ============================================================
document.getElementById('listen-btn').addEventListener('click', () => {
  if (!recognition) {
    document.getElementById('status').textContent = "Your browser doesn't support speech recognition! Type instead!";
    return;
  }

  if (isListening) {
    recognition.stop();
    isListening = false;
    document.getElementById('listen-btn').classList.remove('listening');
    document.getElementById('status').textContent = 'Click the mic or type something!';
    return;
  }

  isListening = true;
  document.getElementById('listen-btn').classList.add('listening');
  document.getElementById('status').textContent = 'Polly is listening... speak now!';
  recognition.start();
});

function handleTextInput() {
  const input = document.getElementById('text-input');
  const text = input.value.trim();
  if (!text) return;

  document.getElementById('status').textContent = 'You typed: "' + text + '"';
  input.value = '';

  setTimeout(() => {
    const funny = funnyTransform(text);
    parrotSpeak(funny);
  }, 500);
}

document.getElementById('send-btn').addEventListener('click', handleTextInput);
document.getElementById('text-input').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') handleTextInput();
});

// ============================================================
// 10. MOUSE INTERACTION - parrot looks at cursor
// ============================================================
window.addEventListener('mousemove', (e) => {
  const mx = (e.clientX / window.innerWidth - 0.5) * 2;
  const my = -(e.clientY / window.innerHeight - 0.5) * 2;

  // Parrot slightly turns toward mouse
  if (!isTalking && !isListening) {
    parrotGroup.rotation.y = mx * 0.3;
    head.rotation.x = -my * 0.15;
  }

  // Eyes follow cursor (pupil is children[2] now)
  leftEye.children[2].position.x = -0.02 + mx * 0.04;
  leftEye.children[2].position.y = my * 0.03;
  rightEye.children[2].position.x = 0.02 + mx * 0.04;
  rightEye.children[2].position.y = my * 0.03;
});

</script>
